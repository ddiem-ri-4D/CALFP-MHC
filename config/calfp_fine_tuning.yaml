# =============================================================================
# CALFP Fine-Tuning Configuration
# =============================================================================
# General information
name: calfp                      # Model name identifier
path: models/fine_tuning         # Path to save model checkpoints

# -----------------------------------------------------------------------------
# Model architecture parameters
# -----------------------------------------------------------------------------
model:
  emb_size: 16                   # Embedding size for amino acid fingerprints
  conv_size: [ 9 ]               # Convolution kernel sizes
  conv_num: [ 64 ]               # Number of convolution filters per kernel size
  conv_off: [ 3 ]                # Convolution offset parameter
  dropout: 0.25                  # Dropout probability
  peptide_pad: 3                 # Padding size for peptide sequences

# -----------------------------------------------------------------------------
# Sequence padding settings
# -----------------------------------------------------------------------------
padding:
  max_len_pep: 24                # Maximum peptide length after padding
  max_len_mhc: 34                # Maximum MHC length after padding

# -----------------------------------------------------------------------------
# Binding-specific padding (used in BindingDataset)
# -----------------------------------------------------------------------------
binding:
  max_len_pep: 24                # Maximum peptide length for binding core prediction
  max_len_mhc: 34                # Maximum MHC length for binding core prediction

# -----------------------------------------------------------------------------
# Training configuration
# -----------------------------------------------------------------------------
train:
  batch_size: 256                # Training batch size
  num_epochs: 20                 # Number of training epochs
  opt_params:
    optimizer_cls: Adam           # Optimizer class
    lr: 0.001                     # Learning rate
    weight_decay: 1e-4            # Weight decay (L2 regularization)

# -----------------------------------------------------------------------------
# Validation configuration
# -----------------------------------------------------------------------------
valid:
  batch_size: 128                # Validation batch size

# -----------------------------------------------------------------------------
# Testing configuration
# -----------------------------------------------------------------------------
test:
  batch_size: 1024               # Test/evaluation batch size
