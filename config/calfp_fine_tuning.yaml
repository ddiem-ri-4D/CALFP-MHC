name: calfp
path: models/fine_tuning

model:
  emb_size: 16
  conv_size: [ 9 ]
  conv_num: [ 64 ]
  conv_off: [ 3 ]
  dropout: 0.25
  peptide_pad: 3

padding:
  max_len_pep: 24
  max_len_mhc: 34

binding:
  max_len_pep: 24
  max_len_mhc: 34

train:
  batch_size: 256
  num_epochs: 20
  opt_params:
    optimizer_cls: Adam
    lr: 0.001
    weight_decay: 1e-4

valid:
  batch_size: 128

test:
  batch_size: 1024
